<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Converter · AI Code Converter</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="app-shell">
<header class="site-header"><a class="brand" href="/converter"><span class="brand-icon">✦</span><span>Code<span>Shift</span></span></a><nav class="main-nav"><a class="nav-link active" href="/converter">Converter</a><a class="nav-link" href="/profile">Profile</a><a class="nav-link" href="/history-page">History</a></nav><div class="header-user"><span class="user-dot">●</span><span id="headerUserName">Account</span><button id="logoutButton" class="logout-button">Log out</button></div></header>
<main class="page-container"><section class="page-heading"><div><p class="eyebrow">DEVELOPER WORKSPACE</p><h1>Convert your code</h1><p>Choose your languages, paste your code, and let AI handle the translation.</p></div><div class="heading-badge">✦ AI powered</div></section>
