<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter · CodeShift</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-shell">
    <header class="site-header">
        <a class="brand" href="/converter"><span class="brand-icon">✦</span><span>Code<span>Shift</span></span></a>
        <nav class="main-nav"><a class="nav-link active" href="/converter">Converter</a><a class="nav-link" href="/profile">Profile</a><a class="nav-link" href="/history-page">History</a></nav>
        <div class="header-user"><span class="user-dot">●</span><span id="headerUserName">Account</span><button id="logoutButton" class="logout-button">Log out</button></div>
    </header>
    <main class="page-container">
        <section class="page-heading"><div><p class="eyebrow">DEVELOPER WORKSPACE</p><h1>Convert your code</h1><p>Enter both languages, paste your complete program, and let AI translate it cleanly.</p></div><div class="heading-badge">✦ AI powered</div></section>
        <section class="converter-card">
            <div class="language-container">
                <div class="language-box"><label for="sourceLanguage">Source language</label><input id="sourceLanguage" type="text" placeholder="Example: Python" autocomplete="off"></div>
                <button id="swapButton" class="swap-button" type="button" title="Swap languages">⇄</button>
                <div class="language-box"><label for="targetLanguage">Target language</label><input id="targetLanguage" type="text" placeholder="Example: JavaScript" autocomplete="off"></div>
            </div>
            <div class="code-container">
                <div class="code-box"><div class="code-title"><label for="inputCode">Input code</label><span class="code-hint">Paste the complete program</span></div><textarea id="inputCode" wrap="off" spellcheck="false" placeholder="Paste your code here..."></textarea></div>
                <div class="code-box output-box"><div class="code-title"><label for="outputCode">Converted code</label><span id="outputProgress" class="code-hint">Ready for output</span></div><textarea id="outputCode" wrap="off" spellcheck="false" readonly placeholder="Your converted code will appear here..."></textarea></div>
            </div>
            <div class="converter-actions"><button id="clearButton" class="secondary-button" type="button">Clear</button><button id="copyButton" class="secondary-button" type="button">Copy code</button><button id="convertButton" class="convert-button" type="button">Convert code <span>→</span></button></div>
            <p id="statusMessage" class="status-text" role="status"></p>
            <div class="explanation-panel"><h3>Code explanation</h3><p id="explanationText">The explanation will appear after conversion.</p></div>
        </section>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
