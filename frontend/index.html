<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Code Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<!-- =========================
     AUTH CONTAINER
========================= -->

<div id="authContainer">

    <div class="auth-card">

        <h1>🤖 AI Code Converter</h1>

        <p>
            Convert code between programming languages using AI
        </p>


        <!-- =========================
             LOGIN FORM
        ========================= -->

        <div
            id="loginForm"
            class="auth-form"
        >

            <h2>Login</h2>


            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >


            <button
                type="button"
                id="loginButton"
            >
                Login
            </button>


            <p class="auth-switch">

                Don't have an account?

                <button
                    type="button"
                    id="showRegister"
                    class="link-button"
                >
                    Register
                </button>

            </p>

        </div>



        <!-- =========================
             REGISTER FORM
        ========================= -->

        <div
            id="registerForm"
            class="auth-form hidden"
        >

            <h2>Create Account</h2>


            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
            >


            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
            >


            <input
                type="password"
                id="registerPassword"
                placeholder="Create password"
            >


            <button
                type="button"
                id="registerButton"
            >
                Register
            </button>


            <p class="auth-switch">

                Already have an account?

                <button
                    type="button"
                    id="showLogin"
                    class="link-button"
                >
                    Login
                </button>

            </p>

        </div>


        <p id="authMessage"></p>

    </div>

</div>



<!-- =========================
     MAIN APPLICATION
========================= -->

<div
    class="container hidden"
    id="appContainer"
>


    <!-- TOP BAR -->

    <div class="top-bar">

        <div>

            <h1>
                🤖 AI Code Converter
            </h1>

            <p>
                Convert your code into any programming language using AI
            </p>

        </div>


        <div class="profile-section">

            <div class="profile-info">

                <span>👤</span>

                <div>

                    <strong id="profileName"></strong>

                    <small id="profileEmail"></small>

                </div>

            </div>


            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </div>



    <!-- =========================
         LANGUAGE SELECT
    ========================= -->

    <div class="language-container">


        <div class="language-box">

            <label for="sourceLanguage">
                Source Language
            </label>


            <select id="sourceLanguage">

                <option
                    value=""
                    selected
                    disabled
                >
                    Select Source Language
                </option>

                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="TypeScript">TypeScript</option>
                <option value="Java">Java</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="C#">C#</option>
                <option value="Go">Go</option>
                <option value="Rust">Rust</option>
                <option value="PHP">PHP</option>
                <option value="Ruby">Ruby</option>
                <option value="Swift">Swift</option>
                <option value="Kotlin">Kotlin</option>
                <option value="Dart">Dart</option>
                <option value="R">R</option>
                <option value="Scala">Scala</option>
                <option value="Perl">Perl</option>
                <option value="Lua">Lua</option>
                <option value="MATLAB">MATLAB</option>
                <option value="Julia">Julia</option>
                <option value="Haskell">Haskell</option>
                <option value="Elixir">Elixir</option>
                <option value="Erlang">Erlang</option>
                <option value="F#">F#</option>
                <option value="VB.NET">VB.NET</option>
                <option value="Objective-C">Objective-C</option>
                <option value="Assembly">Assembly</option>
                <option value="Fortran">Fortran</option>
                <option value="COBOL">COBOL</option>
                <option value="Groovy">Groovy</option>
                <option value="Solidity">Solidity</option>
                <option value="Racket">Racket</option>
                <option value="Scheme">Scheme</option>
                <option value="Common Lisp">Common Lisp</option>
                <option value="Prolog">Prolog</option>
                <option value="Pascal">Pascal</option>
                <option value="Delphi">Delphi</option>

            </select>

        </div>



        <button
            type="button"
            id="swapButton"
            class="swap-button"
        >
            ⇄
        </button>



        <div class="language-box">

            <label for="targetLanguage">
                Target Language
            </label>


            <select id="targetLanguage">

                <option
                    value=""
                    selected
                    disabled
                >
                    Select Target Language
                </option>

                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="TypeScript">TypeScript</option>
                <option value="Java">Java</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="C#">C#</option>
                <option value="Go">Go</option>
                <option value="Rust">Rust</option>
                <option value="PHP">PHP</option>
                <option value="Ruby">Ruby</option>
                <option value="Swift">Swift</option>
                <option value="Kotlin">Kotlin</option>
                <option value="Dart">Dart</option>
                <option value="R">R</option>
                <option value="Scala">Scala</option>
                <option value="Perl">Perl</option>
                <option value="Lua">Lua</option>
                <option value="MATLAB">MATLAB</option>
                <option value="Julia">Julia</option>
                <option value="Haskell">Haskell</option>
                <option value="Elixir">Elixir</option>
                <option value="Erlang">Erlang</option>
                <option value="F#">F#</option>
                <option value="VB.NET">VB.NET</option>
                <option value="Objective-C">Objective-C</option>
                <option value="Assembly">Assembly</option>
                <option value="Fortran">Fortran</option>
                <option value="COBOL">COBOL</option>
                <option value="Groovy">Groovy</option>
                <option value="Solidity">Solidity</option>
                <option value="Racket">Racket</option>
                <option value="Scheme">Scheme</option>
                <option value="Common Lisp">Common Lisp</option>
                <option value="Prolog">Prolog</option>
                <option value="Pascal">Pascal</option>
                <option value="Delphi">Delphi</option>

            </select>

        </div>

    </div>



    <!-- =========================
         CODE EDITORS
    ========================= -->

    <div class="code-container">


        <div class="code-box">

            <div class="code-title">

                <h3>Input Code</h3>

                <button
                    type="button"
                    id="clearButton"
                    class="small-button"
                >
                    Clear
                </button>

            </div>


            <textarea
                id="inputCode"
                placeholder="Paste your code here..."
            ></textarea>

        </div>



        <div class="code-box">

            <div class="code-title">

                <h3>Converted Code</h3>

                <button
                    type="button"
                    id="copyButton"
                    class="small-button"
                >
                    Copy
                </button>

            </div>


            <textarea
                id="outputCode"
                placeholder="Converted code will appear here..."
                readonly
            ></textarea>

        </div>

    </div>



    <!-- =========================
         CONVERT BUTTON
    ========================= -->

    <div class="button-container">

        <button
            type="button"
            id="convertButton"
            class="convert-button"
        >
            ✨ Convert Code
        </button>

    </div>


    <p id="statusMessage"></p>



    <!-- =========================
         HISTORY
    ========================= -->

    <div class="history-section">

        <div class="history-header">

            <h2>
                📜 Conversion History
            </h2>


            <button
                type="button"
                id="clearHistoryButton"
                class="danger-button"
            >
                🗑 Clear All
            </button>

        </div>


        <div id="historyList"></div>

    </div>


</div>



<!-- JAVASCRIPT -->

<script
    src="/static/script.js"
></script>


</body>

</html>
