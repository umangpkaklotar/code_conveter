<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome · AI Code Converter</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page-shell">
    <main id="authContainer" class="auth-layout">
        <section class="auth-hero">
            <div class="brand-mark">✦</div>
            <p class="eyebrow">AI CODE CONVERTER</p>
            <h1>Build once.<br><span>Translate everywhere.</span></h1>
            <p class="hero-copy">Convert code between languages with a focused workspace designed for developers.</p>
            <div class="hero-pills"><span>⚡ Fast conversion</span><span>🔒 Private workspace</span></div>
        </section>
        <section class="auth-card">
            <div class="auth-tabs"><button id="loginTab" class="auth-tab active">Sign in</button><button id="registerTab" class="auth-tab">Create account</button></div>
            <div id="loginForm" class="auth-form">
                <p class="eyebrow">WELCOME BACK</p><h2>Sign in to your workspace</h2>
                <label for="loginEmail">Email address</label><input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
                <label for="loginPassword">Password</label><input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                <button type="button" id="loginButton" class="primary-button">Sign in <span>→</span></button>
                <p class="auth-switch">New here? <button type="button" id="showRegister" class="link-button">Create an account</button></p>
            </div>
            <div id="registerForm" class="auth-form hidden">
                <p class="eyebrow">GET STARTED</p><h2>Create your account</h2>
                <label for="registerName">Full name</label><input type="text" id="registerName" placeholder="Your name" autocomplete="name">
                <label for="registerEmail">Email address</label><input type="email" id="registerEmail" placeholder="you@example.com" autocomplete="email">
                <label for="registerPassword">Password</label><input type="password" id="registerPassword" placeholder="At least 6 characters" autocomplete="new-password">
                <button type="button" id="registerButton" class="primary-button">Create account <span>→</span></button>
                <p class="auth-switch">Already registered? <button type="button" id="showLogin" class="link-button">Sign in</button></p>
            </div>
            <p id="authMessage" role="alert"></p>
        </section>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
